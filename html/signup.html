<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account · TaskFlow</title>
  <link rel="stylesheet" href="/css/signup.css">
</head>
<body>

  <main class="page">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12.5L9.5 17L19 7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">TaskFlow</span>
      </div>

      <!-- Heading -->
      <div class="heading">
        <h1>Create Account</h1>
        <p class="subtitle">Start organizing your work in minutes.</p>
      </div>

      <!-- Form -->
      <form class="login-form">

        <div class="field-group">
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Jane Cooper"
            autocomplete="name"
            required
          >
        </div>

        <div class="field-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="jane_cooper"
            autocomplete="username"
            required
          >
        </div>

        <div class="field-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          >
          <span class="field-hint">Must be at least 8 characters.</span>
        </div>

        <div class="field-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-row form-row--single">
          <label class="checkbox-label" for="terms">
            <input type="checkbox" id="terms" name="terms" required>
            <span>I agree to the <a href="#" class="inline-link">Terms of Service</a> and <a href="#" class="inline-link">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="btn-primary" id="createBtn">Create Account</button>

      </form>

      <!-- Sign in -->
      <p class="signup-text">
        Already have an account? <a href="/login" class="signup-link">Sign In</a>
      </p>

    </div>

    <!-- Footer -->
    <footer class="page-footer">
      <p>&copy; 2026 TaskFlow. All rights reserved.</p>
    </footer>
  </main>
<script src="/script/api.js"></script>
<script src="/script/signup.js"></script>
</body>
</html>
