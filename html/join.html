<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Board · TaskFlow</title>
    <link rel="stylesheet" href="/css/join.css" />
  </head>
  <body>
    <div class="invitation-page">
      <!-- Topbar -->
      <header class="invitation-topbar">
        <a href="/" class="invitation-brand">
          <span class="brand-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 12.5L9.5 17L19 7"
                stroke="white"
                stroke-width="2.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span>TaskFlow</span>
        </a>
      </header>

      <!-- Main content -->
      <main class="invitation-main">
        <section
          id="invitationCard"
          class="invitation-card"
          aria-labelledby="invitation-title"
        >
          <div class="invitation-card-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M9 12H3M3 12L7 8M3 12L7 16"
                stroke="#2563EB"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M14 6H19C20.1046 6 21 6.89543 21 8V16C21 17.1046 20.1046 18 19 18H14"
                stroke="#2563EB"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </div>

          <div class="invitation-card-header">
            <h1 id="invitation-title">Join Board</h1>
            <p class="invitation-sub">
              You've been invited to join
              <strong id="invitationBoardName"></strong>.
              Review the details below before you join.
            </p>
          </div>

          <!-- Board information -->
          <div class="board-info">
            <p class="board-info-name" id="invitationBoardNameDisplay">
              
            </p>
            <p class="board-info-description" id="invitationBoardDescription">
              Everything needed to ship the product launch, from design
              through release notes.
            </p>

            <ul class="board-info-list">
              <li class="board-info-row">
                <span class="board-info-row-icon" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <circle
                      cx="9"
                      cy="8"
                      r="3"
                      stroke="currentColor"
                      stroke-width="1.8"
                    />
                    <path
                      d="M3.5 19c0-2.8 2.5-5 5.5-5s5.5 2.2 5.5 5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
                <span class="board-info-row-label">Owner</span>
                <span class="board-info-row-value" id="invitationBoardOwner">
                  
                </span>
              </li>

              <li class="board-info-row">
                <span class="board-info-row-icon" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <rect
                      x="5"
                      y="10"
                      width="14"
                      height="9"
                      rx="1.5"
                      stroke="currentColor"
                      stroke-width="1.8"
                    />
                    <path
                      d="M8 10V7a4 4 0 0 1 8 0v3"
                      stroke="currentColor"
                      stroke-width="1.8"
                    />
                  </svg>
                </span>
                <span class="board-info-row-label">Visibility</span>
                <span
                  class="board-info-row-value"
                  id="invitationBoardVisibility"
                >
                  <span class="visibility-tag"
                    ></span
                  >
                </span>
              </li>

              <li class="board-info-row">
                <span class="board-info-row-icon" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <circle
                      cx="9"
                      cy="8"
                      r="3"
                      stroke="currentColor"
                      stroke-width="1.8"
                    />
                    <circle
                      cx="17"
                      cy="9"
                      r="2.3"
                      stroke="currentColor"
                      stroke-width="1.8"
                    />
                    <path
                      d="M3.5 19c0-2.8 2.5-5 5.5-5s5.5 2.2 5.5 5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                    <path
                      d="M15 14.3c2 .3 3.5 2 3.5 4.7"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
                <span class="board-info-row-label">Members</span>
                <span class="board-info-row-value" id="invitationBoardMembers"
                  ></span
                >
              </li>
            </ul>
          </div>

          <!-- Status area: loading / success / error, hidden until JS sets it -->
          <p
            id="joinStatus"
            class="join-status"
            role="status"
            aria-live="polite"
            hidden
          ></p>

          <!-- Actions -->
          <div class="invitation-actions">
            <button type="button" id="joinBoardBtn" class="btn-primary">
              <span class="btn-label">Join board</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
            <button type="button" id="cancelJoinBtn" class="btn-secondary">
              Cancel
            </button>
          </div>
        </section>

        <p class="invitation-footnote">
          Not who you expected? <a href="/dashboard">Go to your dashboard</a>
          instead.
        </p>
      </main>
    </div>

    <script src="/script/api.js"></script>
    <script src="/script/join.js"></script>
  </body>
</html>
